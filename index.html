<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub – jogos HTML</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#222;--mut:#777;--ac:#fa5c5c;--bd:#ddd;--hd:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1b;--card:#2a2a2a;--tx:#eee;--mut:#9a9a9a;--bd:#3a3a3a;--hd:#111}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}
header{background:var(--hd);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{font-weight:800;font-size:20px;color:var(--ac)}header nav{margin-left:auto;display:flex;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
textarea{width:100%;min-height:120px}button,.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600;border-radius:6px;padding:8px 14px;display:inline-block}
.btn.g{background:transparent;border:1px solid var(--bd);color:inherit}
main{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--bd);transition:.15s}.card:hover{transform:translateY(-3px)}
.card img,.ph{width:100%;aspect-ratio:315/250;object-fit:cover;display:block;background:#555}
.card div{padding:4px 12px}.ct{font-weight:700;padding-top:10px!important}.cs{color:var(--mut);font-size:13px}.cm{font-size:12px;color:var(--mut);padding-bottom:10px!important}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.player{background:#000;border-radius:8px;overflow:hidden;text-align:center;margin-bottom:16px;position:relative}
.player img{width:100%;max-height:420px;object-fit:cover;opacity:.5;display:block}
.player .play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.player iframe{border:0;width:100%;background:#000;display:block}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:12px}
.shots{display:flex;gap:8px;overflow-x:auto}.shots img{height:130px;border-radius:6px;cursor:zoom-in}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}td:first-child{color:var(--mut)}
label{display:block;margin:12px 0 4px;font-weight:600}.f input,.f select{width:100%}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stars{color:#f5b301}.msg{color:var(--ac);margin:8px 0}.desc{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<header><a class="logo" href="#/">🎮 GameHub</a>
<input id="hq" placeholder="Buscar jogos…" style="min-width:200px">
<nav id="nav"></nav></header>
<main id="app">Carregando…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ====== CONFIG: cole os dados do seu projeto Supabase (Project Settings > API) ======
const SB_URL = 'https://iujervnsbozespphjhcm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1amVydm5zYm96ZXNwcGhqaGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTIwNDUsImV4cCI6MjA4OTYyODA0NX0.OUGDyjbUnqpHY48fOz0Ulzs57P2rYvZcEXMf-ivghMo';
const MAX_ZIP_MB = 50; // limite padrão do plano grátis do Supabase
const GENRES = ['Ação','Aventura','Arcade','Puzzle','Plataforma','RPG','Estratégia','Simulação','Terror','Corrida','Esportes','Casual','Outro'];
const STATUS = ['Lançado','Em desenvolvimento','Protótipo','Jam'];
// =====================================================================================
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = p => p > 0 ? 'R$ ' + Number(p).toFixed(2).replace('.', ',') : 'Grátis';
const LINKS = ['Steam','Microsoft Store','Xbox','Epic Games','GOG','itch.io','Google Play','App Store','Nintendo eShop','PlayStation Store','Humble Store','Site oficial','Discord','YouTube','Twitter/X','Instagram','Outro'];
const safeUrl = u => { try { return ['http:','https:'].includes(new URL(u).protocol); } catch (e) { return false; } };
const ytId = u => (String(u || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/) || [])[1];
const rmFile = async (bucket, url) => { try { const p = decodeURIComponent((url || '').split(`/object/public/${bucket}/`)[1] || ''); if (p) await sb.storage.from(bucket).remove([p]); } catch (e) {} };
const friendly = e => { const m = e?.message || String(e); return /upstream connect|failed to fetch|networkerror|reset reason|111/i.test(m) ? 'Não foi possível conectar ao Supabase. Veja se o projeto está pausado (Dashboard → Restore project) e se a SB_URL está correta.' : m; };
const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
let user = null, F = {q:'', genre:'', sort:'created_at'};

function nav() {
  document.getElementById('nav').innerHTML = user
    ? `<a class="btn" href="#/upload">+ Enviar jogo</a><a class="btn g" style="color:#fff" href="#/me">Meus jogos</a><button class="g btn" onclick="sb.auth.signOut()">Sair</button>`
    : `<a class="btn" href="#/login">Entrar</a>`;
}
document.getElementById('hq').addEventListener('keydown', e => { if (e.key === 'Enter') { F.q = e.target.value; location.hash = '#/'; route(); } });

async function route() {
  const [, page, id] = location.hash.split('/');
  window.scrollTo(0, 0);
  try {
    if (page === 'game') return await gamePage(id);
    if (page === 'upload') return user ? formPage() : (location.hash = '#/login');
    if (page === 'edit') return user ? formPage(id) : (location.hash = '#/login');
    if (page === 'me') return user ? await myGames() : (location.hash = '#/login');
    if (page === 'login') return loginPage();
    return await home();
  } catch (e) { app.innerHTML = `<div class="box msg">Erro: ${esc(friendly(e))}<br><small>Confira SB_URL / SB_KEY e se rodou setup.sql e update.sql.</small></div>`; }
}

const card = g => `<a class="card" href="#/game/${g.id}">${g.cover_url ? `<img loading="lazy" src="${esc(g.cover_url)}">` : '<div class="ph"></div>'}
<div class="ct">${esc(g.title)}</div><div class="cs">${esc(g.tagline)}</div>
<div class="cm">${esc(g.genre || '')} · ${money(g.price)} ${g.zip_url ? ' · ▶ ' + g.plays : ' · 🚧 Em breve'}</div></a>`;

async function home() {
  let q = sb.from('games').select('*').order(F.sort, {ascending: false});
  if (F.genre) q = q.eq('genre', F.genre);
  if (F.q) q = q.ilike('title', `%${F.q}%`);
  const {data, error} = await q; if (error) throw error;
  app.innerHTML = `<div class="bar">
  <select id="fg"><option value="">Todos os gêneros</option>${GENRES.map(g => `<option ${F.genre === g ? 'selected' : ''}>${g}</option>`).join('')}</select>
  <select id="fs"><option value="created_at">Mais recentes</option><option value="plays" ${F.sort === 'plays' ? 'selected' : ''}>Mais jogados</option></select></div>
  ${F.q ? `<p>Busca: <b>${esc(F.q)}</b> <a href="#/" onclick="F.q='';document.getElementById('hq').value=''">limpar</a></p>` : ''}
  <div class="grid">${data.map(card).join('') || '<p>Nenhum jogo ainda. Seja o primeiro a enviar!</p>'}</div>`;
  fg.onchange = e => { F.genre = e.target.value; home(); };
  fs.onchange = e => { F.sort = e.target.value; home(); };
}

async function gamePage(id) {
  const {data: g, error} = await sb.from('games').select('*').eq('id', id).single(); if (error) throw error;
  const {data: rv} = await sb.from('reviews').select('*').eq('game_id', id).order('created_at', {ascending: false});
  const avg = rv.length ? rv.reduce((a, r) => a + r.rating, 0) / rv.length : 0;
  const mine = user && g.user_id === user.id;
  const lnk = (g.links || []).filter(l => safeUrl(l.url));
  const yt = ytId(g.trailer_url);
  const extra = `${lnk.length ? `<h4 style="margin:14px 0 6px">Também disponível em</h4>${lnk.map(l => `<a class="btn g" style="display:block;margin:4px 0;text-align:center" target="_blank" rel="noopener noreferrer nofollow" href="${esc(l.url)}">${esc(l.label)} ↗</a>`).join('')}` : ''}
  ${safeUrl(g.website) ? `<p><a class="btn g" style="display:block;text-align:center" target="_blank" rel="noopener noreferrer" href="${esc(g.website)}">🌐 Site do jogo ↗</a></p>` : ''}
  ${g.support_email ? `<h4 style="margin:14px 0 6px">Suporte</h4><a style="color:var(--ac)" href="mailto:${esc(g.support_email)}">✉ ${esc(g.support_email)}</a>` : ''}`;
  app.innerHTML = `<h1 style="margin:0">${esc(g.title)}</h1><p class="cs">${esc(g.tagline)}</p>
  <div class="player" id="pl">${g.cover_url ? `<img src="${esc(g.cover_url)}">` : ''}
    ${g.zip_url ? `<div class="play"><button id="pb" style="font-size:20px;padding:14px 30px">▶ Jogar agora</button><small>${g.width}×${g.height}</small></div>`
      : `<div class="play" style="background:rgba(0,0,0,.45)"><b style="font-size:22px">🚧 Em breve</b><small>Este jogo ainda não tem uma build jogável.</small>${mine ? `<a class="btn" href="#/edit/${g.id}">Enviar a build agora</a>` : ''}</div>`}</div>
  <div class="cols"><div>
    <div class="box"><h3 style="margin-top:0">Sobre o jogo</h3><div class="desc">${esc(g.description) || '—'}</div></div>
    ${g.controls ? `<div class="box"><h3 style="margin-top:0">Controles</h3><div class="desc">${esc(g.controls)}</div></div>` : ''}
    ${yt ? `<div class="box"><h3 style="margin-top:0">Trailer</h3><iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:6px" src="https://www.youtube-nocookie.com/embed/${yt}" allowfullscreen></iframe></div>` : ''}
    ${g.screenshots?.length ? `<div class="box"><h3 style="margin-top:0">Capturas de tela</h3><div class="shots">${g.screenshots.map(s => `<img src="${esc(s)}" onclick="window.open(this.src)">`).join('')}</div></div>` : ''}
    <div class="box"><h3 style="margin-top:0">Avaliações (${rv.length}) <span class="stars">${avg ? stars(avg) + ' ' + avg.toFixed(1) : ''}</span></h3>
    ${user ? `<select id="rs">${[5,4,3,2,1].map(n => `<option value="${n}">${stars(n)}</option>`).join('')}</select>
    <textarea id="rc" placeholder="Seu comentário…" style="min-height:70px;margin:8px 0"></textarea><button id="rb">Enviar avaliação</button>` : '<p><a href="#/login" style="color:var(--ac)">Entre</a> para avaliar.</p>'}
    ${rv.map(r => `<div style="border-top:1px solid var(--bd);margin-top:12px;padding-top:8px"><b>${esc(r.username)}</b> <span class="stars">${stars(r.rating)}</span><div class="desc">${esc(r.comment)}</div></div>`).join('')}</div>
  </div><div>
    <div class="box"><table>
    <tr><td>Autor</td><td>${esc(g.author)}</td></tr><tr><td>Preço</td><td>${money(g.price)}</td></tr>
    <tr><td>Gênero</td><td>${esc(g.genre)}</td></tr><tr><td>Status</td><td>${esc(g.status)}</td></tr>
    <tr><td>Versão</td><td>${esc(g.version) || '—'}</td></tr><tr><td>Plataforma</td><td>${esc(g.platform)}</td></tr>
    ${g.languages ? `<tr><td>Idiomas</td><td>${esc(g.languages)}</td></tr>` : ''}${g.age_rating ? `<tr><td>Classificação</td><td>${esc(g.age_rating)}</td></tr>` : ''}<tr><td>Jogadas</td><td id="pc">${g.plays}</td></tr><tr><td>Publicado</td><td>${new Date(g.created_at).toLocaleDateString('pt-BR')}</td></tr></table>
    <div style="margin-top:10px">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    ${mine && g.zip_url ? `<p><a class="btn g" href="${esc(g.zip_url)}" download>⬇ Baixar .zip (só você vê)</a></p>` : ''}
    ${extra}
    ${mine ? `<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><a class="btn" href="#/edit/${g.id}">✎ Editar jogo</a> <button class="g" style="color:var(--ac)" id="del">Excluir</button>` : ''}</div></div></div>`;
  if (window.pb) pb.onclick = () => play(g);
  if (window.rb) rb.onclick = async () => {
    const {error} = await sb.from('reviews').upsert({game_id: id, user_id: user.id, username: user.user_metadata?.name || user.email.split('@')[0], rating: +rs.value, comment: rc.value}, {onConflict: 'game_id,user_id'});
    error ? alert(friendly(error)) : gamePage(id);
  };
  if (window.del) del.onclick = async () => { if (confirm('Excluir este jogo e seus arquivos?')) { const {error} = await sb.from('games').delete().eq('id', id); if (error) return alert(friendly(error)); await rmFile('covers', g.cover_url); await rmFile('games', g.zip_url); for (const s of g.screenshots || []) await rmFile('screens', s); location.hash = '#/me'; } };
}

// ---------- Executa o jogo: baixa o .zip, extrai no navegador e roda num iframe ----------
const MIME = {html:'text/html',js:'text/javascript',mjs:'text/javascript',css:'text/css',json:'application/json',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',wasm:'application/wasm',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',txt:'text/plain',mp4:'video/mp4',webm:'video/webm'};
const resolve = (dir, rel) => decodeURIComponent(new URL(rel, 'http://x/' + dir).pathname.slice(1));
async function play(g) {
  pb.disabled = true; pb.textContent = 'Carregando…';
  try {
    sb.rpc('inc_plays', {gid: g.id}); pc.textContent = g.plays + 1;
    const zip = await JSZip.loadAsync(await (await fetch(g.zip_url)).arrayBuffer());
    const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && !n.startsWith('__MACOSX'));
    const idx = names.filter(n => /(^|\/)index\.html$/i.test(n)).sort((a, b) => a.length - b.length)[0];
    if (!idx) throw new Error('index.html não encontrado no .zip');
    const base = idx.slice(0, idx.length - 'index.html'.length), M = {};
    const files = names.filter(n => n.startsWith(base));
    for (const n of files) { // 1º tudo que não é CSS/HTML, 2º CSS (que referencia os outros)
      const ext = n.split('.').pop().toLowerCase(); if (ext === 'css' || n === idx) continue;
      M[n.slice(base.length)] = URL.createObjectURL(new Blob([await zip.files[n].async('arraybuffer')], {type: MIME[ext] || 'application/octet-stream'}));
    }
    for (const n of files.filter(n => n.toLowerCase().endsWith('.css'))) {
      const rel = n.slice(base.length), dir = rel.includes('/') ? rel.replace(/[^/]*$/, '') : '';
      const css = (await zip.files[n].async('string')).replace(/url\(\s*['"]?([^'")]+)['"]?\s*\)/g, (m, u) => /^(data:|https?:|blob:)/.test(u) ? m : `url("${M[resolve(dir, u.split(/[?#]/)[0])] || u}")`);
      M[rel] = URL.createObjectURL(new Blob([css], {type: 'text/css'}));
    }
    const doc = new DOMParser().parseFromString(await zip.files[idx].async('string'), 'text/html');
    doc.querySelectorAll('[src],[href]').forEach(el => ['src', 'href'].forEach(a => {
      const v = el.getAttribute(a); if (v && !/^(data:|https?:|blob:|#|\/\/)/.test(v) && M[resolve('', v.split(/[?#]/)[0])]) el.setAttribute(a, M[resolve('', v.split(/[?#]/)[0])]);
    }));
    const patch = `<script>(()=>{const M=${JSON.stringify(M)};const n=u=>{if(typeof u!=='string'||/^(blob:|data:|https?:|\\/\\/)/.test(u))return u;let p=u.split(/[?#]/)[0].replace(/^(\\.\\/|\\/)+/,'');try{p=decodeURI(p)}catch(e){}return M[p]||u};const f=window.fetch;window.fetch=(a,b)=>f(typeof a==='string'?n(a):a,b);const o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u,...r){return o.call(this,m,n(u),...r)};const d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(HTMLImageElement.prototype,'src',{set(v){d.set.call(this,n(v))},get(){return d.get.call(this)}})})()<\/script>`;
    doc.head.insertAdjacentHTML('afterbegin', patch);
    const pl = document.getElementById('pl');
    pl.innerHTML = `<iframe id="gf" width="${g.width}" height="${g.height}" style="max-width:100%;height:${g.height}px" allow="fullscreen; autoplay; gamepad" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups"></iframe>
    <div style="padding:8px;background:#111"><button onclick="gf.requestFullscreen()">⛶ Tela cheia</button></div>`;
    document.getElementById('gf').srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
  } catch (e) { alert('Erro ao iniciar: ' + e.message); pb.disabled = false; pb.textContent = '▶ Jogar agora'; }
}

// ---------- Criar / Editar ----------
async function formPage(id) {
  let g = null;
  if (id) { const {data} = await sb.from('games').select('*').eq('id', id).single(); if (!data || data.user_id !== user.id) return (location.hash = '#/'); g = data; }
  const E = !!g, v = (k, d = '') => esc(g?.[k] ?? d), $ = i => document.getElementById(i);
  const opts = (arr, cur) => arr.map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('');
  app.innerHTML = `<div class="box f"><h2 style="margin-top:0">${E ? 'Editar jogo' : 'Enviar novo jogo'}</h2>
  <label>Título *</label><input id="f-t" value="${v('title')}"><label>Frase curta</label><input id="f-tl" maxlength="100" value="${v('tagline')}">
  <label>Descrição</label><textarea id="f-d">${v('description')}</textarea>
  <label>Controles (ex.: WASD mover, espaço pular)</label><textarea id="f-c" style="min-height:60px">${v('controls')}</textarea>
  <div class="r2"><div><label>Gênero</label><select id="f-gn">${opts(GENRES, g?.genre)}</select></div>
  <div><label>Status</label><select id="f-st">${opts(STATUS, g?.status)}</select></div>
  <div><label>Versão</label><input id="f-v" placeholder="1.0.0" value="${v('version')}"></div><div><label>Preço (R$, 0 = grátis)</label><input id="f-p" type="number" min="0" step="0.01" value="${v('price', 0)}"></div>
  <div><label>Largura (px)</label><input id="f-w" type="number" value="${v('width', 960)}"></div><div><label>Altura (px)</label><input id="f-h" type="number" value="${v('height', 600)}"></div>
  <div><label>Idiomas</label><input id="f-lg" placeholder="Português, Inglês" value="${v('languages')}"></div>
  <div><label>Classificação etária</label><select id="f-ar">${opts(['Livre','10+','12+','14+','16+','18+'], g?.age_rating)}</select></div></div>
  <label>Tags (separadas por vírgula)</label><input id="f-tg" placeholder="pixel art, singleplayer" value="${esc((g?.tags || []).join(', '))}">
  <h3>Contato e links</h3>
  <label>E-mail de suporte</label><input id="f-se" type="email" placeholder="suporte@seusite.com" value="${v('support_email')}">
  <label>Site oficial</label><input id="f-ws" placeholder="https://" value="${v('website')}">
  <label>Trailer (link do YouTube)</label><input id="f-tr" placeholder="https://youtube.com/watch?v=..." value="${v('trailer_url')}">
  <label>Também disponível em (Steam, Microsoft Store, etc.)</label><div id="f-lk"></div><button type="button" class="g btn" id="f-al" style="margin-top:6px">+ Adicionar link</button>
  <h3>Arquivos</h3>
  <label>Capa ${E ? '(deixe vazio para manter a atual)' : '*'}</label>${E && g.cover_url ? `<img src="${esc(g.cover_url)}" style="height:80px;border-radius:6px;display:block;margin-bottom:6px">` : ''}<input id="f-cv" type="file" accept="image/*">
  <label>Capturas de tela ${E ? '(as novas serão adicionadas)' : ''}</label>
  ${E && g.screenshots?.length ? `<div class="shots" style="margin-bottom:6px">${g.screenshots.map((s, i) => `<label style="font-weight:400;margin:0"><img src="${esc(s)}" style="height:80px"><br><input type="checkbox" class="f-rm" value="${i}"> remover</label>`).join('')}</div>` : ''}
  <input id="f-sc" type="file" accept="image/*" multiple>
  <label>Build do jogo (.zip com index.html) ${E && g.zip_url ? '(deixe vazio para manter a atual)' : '(opcional)'}</label><input id="f-zp" type="file" accept=".zip">
  <p class="cs">Sem build, o jogo é publicado como <b>🚧 Em breve</b> (só a página, sem botão de jogar). Você pode enviar a build depois, em "Editar".</p>
  ${E && g.zip_url ? `<label style="font-weight:400"><input type="checkbox" id="f-rz"> Remover a build atual (voltar para "Em breve")</label>` : ''}
  <p class="cs">Limite do zip: ${MAX_ZIP_MB} MB.</p><div class="msg" id="f-m"></div><button id="f-b">${E ? 'Salvar alterações' : 'Publicar'}</button> ${E ? `<a class="btn g" href="#/game/${id}">Cancelar</a>` : ''}</div>`;
  const addLink = (l = 'Steam', u = '') => { const r = document.createElement('div'); r.style.cssText = 'display:flex;gap:6px;margin-top:6px';
    r.innerHTML = `<select style="width:170px">${opts(LINKS, l)}</select><input placeholder="https://" value="${esc(u)}" style="flex:1"><button type="button" class="g btn">✕</button>`;
    r.querySelector('button').onclick = () => r.remove(); $('f-lk').appendChild(r); };
  (g?.links || []).forEach(l => addLink(l.label, l.url)); $('f-al').onclick = () => addLink();
  $('f-b').onclick = async () => {
    try {
      const cv = $('f-cv').files[0], zp = $('f-zp').files[0], msg = t => $('f-m').textContent = t;
      if (!$('f-t').value.trim()) throw new Error('Informe o título.');
      if (!E && !cv) throw new Error('A capa é obrigatória.');
      if (zp && zp.size > MAX_ZIP_MB * 1048576) throw new Error(`Zip maior que ${MAX_ZIP_MB} MB.`);
      const links = [...$('f-lk').children].map(r => ({label: r.querySelector('select').value, url: r.querySelector('input').value.trim()})).filter(l => l.url);
      for (const u of [...links.map(l => l.url), $('f-ws').value.trim(), $('f-tr').value.trim()]) if (u && !safeUrl(u)) throw new Error('Link inválido (use http:// ou https://): ' + u);
      $('f-b').disabled = true;
      const up = async (bucket, f) => {
        const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${f.name.replace(/[^\w.\-]/g, '_')}`;
        const {error} = await sb.storage.from(bucket).upload(path, f, {contentType: f.type || 'application/zip'}); if (error) throw error;
        return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
      };
      const row = {title: $('f-t').value.trim(), tagline: $('f-tl').value, description: $('f-d').value, controls: $('f-c').value, genre: $('f-gn').value, status: $('f-st').value,
        version: $('f-v').value, price: +$('f-p').value || 0, width: +$('f-w').value || 960, height: +$('f-h').value || 600, languages: $('f-lg').value, age_rating: $('f-ar').value,
        tags: $('f-tg').value.split(',').map(s => s.trim()).filter(Boolean), support_email: $('f-se').value.trim(), website: $('f-ws').value.trim(), trailer_url: $('f-tr').value.trim(), links};
      const oldCover = g?.cover_url, oldZip = g?.zip_url, removed = [];
      let shots = g?.screenshots || [];
      if (E) { const rm = [...document.querySelectorAll('.f-rm:checked')].map(c => +c.value); rm.forEach(i => removed.push(shots[i])); shots = shots.filter((_, i) => !rm.includes(i)); }
      if (cv) { msg('Enviando capa…'); row.cover_url = await up('covers', cv); }
      const files = [...$('f-sc').files]; for (const [i, f] of files.entries()) { msg(`Enviando capturas ${i + 1}/${files.length}…`); shots.push(await up('screens', f)); }
      row.screenshots = shots;
      if (zp) { msg('Enviando zip…'); row.zip_url = await up('games', zp); } else if ($('f-rz')?.checked) row.zip_url = null;
      msg('Salvando…');
      const q = E ? sb.from('games').update(row).eq('id', id) : sb.from('games').insert({...row, author: user.user_metadata?.name || user.email.split('@')[0]});
      const {data, error} = await q.select().single(); if (error) throw error;
      if (E) { if (cv) await rmFile('covers', oldCover); if (row.zip_url !== undefined) await rmFile('games', oldZip); for (const s of removed) await rmFile('screens', s); }
      location.hash = '#/game/' + data.id;
    } catch (e) { $('f-m').textContent = friendly(e); $('f-b').disabled = false; }
  };
}

async function myGames() {
  const {data} = await sb.from('games').select('*').eq('user_id', user.id).order('created_at', {ascending: false});
  app.innerHTML = `<h2>Meus jogos</h2><div class="grid">${data.map(g => `<div>${card(g)}<a class="btn g" style="margin-top:6px" href="#/edit/${g.id}">✎ Editar</a></div>`).join('') || '<p>Você ainda não enviou nada.</p>'}</div>`;
}

function loginPage() {
  app.innerHTML = `<div class="box f" style="max-width:380px;margin:auto"><h2 style="margin-top:0">Entrar / Criar conta</h2>
  <label>Nome de usuário (só no cadastro)</label><input id="ln"><label>E-mail</label><input id="le" type="email"><label>Senha</label><input id="lp" type="password">
  <div class="msg" id="lm"></div><button id="li">Entrar</button> <button class="g" id="ls">Criar conta</button></div>`;
  li.onclick = async () => { const {error} = await sb.auth.signInWithPassword({email: le.value, password: lp.value}); error ? lm.textContent = error.message : location.hash = '#/'; };
  ls.onclick = async () => { const {error} = await sb.auth.signUp({email: le.value, password: lp.value, options: {data: {name: ln.value || le.value.split('@')[0]}}});
    lm.textContent = error ? error.message : 'Conta criada! Se pediu confirmação, verifique seu e-mail.'; };
}

sb.auth.onAuthStateChange((_e, s) => { user = s?.user || null; nav(); route(); });
window.addEventListener('hashchange', route);
</script>
</body>
</html>
