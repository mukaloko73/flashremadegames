<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash Classics</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#222;--mut:#777;--ac:#fa5c5c;--bd:#ddd;--hd:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1b;--card:#2a2a2a;--tx:#eee;--mut:#9a9a9a;--bd:#3a3a3a;--hd:#111}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}
header{background:var(--hd);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{font-weight:800;font-size:20px;color:var(--ac)}header nav{margin-left:auto;display:flex;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
textarea{width:100%;min-height:120px}button,.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600;border-radius:6px;padding:8px 14px;display:inline-block}
.btn.g{background:transparent;border:1px solid var(--bd);color:inherit}
main{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.bar input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--bd);transition:.15s}.card:hover{transform:translateY(-3px)}
.card img,.ph{width:100%;aspect-ratio:315/250;object-fit:cover;display:block;background:#555}
.card div{padding:4px 12px}.ct{font-weight:700;padding-top:10px!important}.cs{color:var(--mut);font-size:13px}.cm{font-size:12px;color:var(--mut);padding-bottom:10px!important}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.player{background:#000;border-radius:8px;overflow:hidden;text-align:center;margin-bottom:16px;position:relative}
.player img{width:100%;max-height:420px;object-fit:cover;opacity:.5;display:block}
.player .play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.player iframe{border:0;width:100%;background:#000;display:block}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:12px}
.shots{display:flex;gap:8px;overflow-x:auto}.shots img{height:130px;border-radius:6px;cursor:zoom-in}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}td:first-child{color:var(--mut)}
label{display:block;margin:12px 0 4px;font-weight:600}.f input,.f select{width:100%}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stars{color:#f5b301}.msg{color:var(--ac);margin:8px 0}.desc{white-space:pre-wrap;line-height:1.6}
.f input[type=checkbox]{width:auto;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:5px 12px;border-radius:20px;font-weight:500}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb td{padding:8px 6px}.tb td:first-child{color:inherit}.player{min-height:260px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 10px}
h3{margin:18px 0 8px}
</style>
</head>
<body>
<header><a class="logo" href="#/">🕹️ Flash Classics</a>
<input id="hq" placeholder="Buscar jogos…" style="min-width:200px">
<nav id="nav"></nav></header>
<main id="app">Carregando…</main>
<footer id="ft"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
// ====== CONFIG: cole os dados do seu projeto Supabase (Project Settings > API) ======
const SB_URL = 'https://iujervnsbozespphjhcm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1amVydm5zYm96ZXNwcGhqaGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTIwNDUsImV4cCI6MjA4OTYyODA0NX0.OUGDyjbUnqpHY48fOz0Ulzs57P2rYvZcEXMf-ivghMo';
const SITE_NAME = 'Flash Classics';
const CONTACT_EMAIL = 'contato@seusite.com'; // aparece no rodapé (contato / remoção de conteúdo)
const MAX_MB = 50; // limite por arquivo no plano grátis do Supabase
const CATS = ['Culinária','Gerenciamento','Ação','Aventura','Arcade','Puzzle','Plataforma','Esportes','Corrida','Tiro','Estratégia','Defesa de torre','Luta','RPG','Terror','Simulação','Vestir e moda','Música','Casual','Outros'];
// =====================================================================================
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
const safeUrl = u => { try { return ['http:','https:'].includes(new URL(u).protocol); } catch (e) { return false; } };
const rmFile = async (bucket, url) => { try { const p = decodeURIComponent((url || '').split(`/object/public/${bucket}/`)[1] || ''); if (p) await sb.storage.from(bucket).remove([p]); } catch (e) {} };
const friendly = e => { const m = e?.message || String(e); return /upstream connect|failed to fetch|networkerror|reset reason|111/i.test(m) ? 'Não foi possível conectar ao Supabase. Veja se o projeto está pausado (Dashboard → Restore project) e se a SB_URL está correta.' : m; };
const MIME = {html:'text/html',js:'text/javascript',mjs:'text/javascript',css:'text/css',json:'application/json',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',wasm:'application/wasm',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',txt:'text/plain',mp4:'video/mp4',webm:'video/webm'};
let user = null, isDev = false, isOwner = false, F = {q: '', cat: '', series: '', sort: 'created_at', limit: 48};
const setF = (k, v) => { F[k] = v; if (k !== 'limit') F.limit = 48; home(); };

document.title = SITE_NAME;
document.querySelector('.logo').textContent = '🕹️ ' + SITE_NAME;
document.getElementById('ft').innerHTML = `© ${new Date().getFullYear()} ${esc(SITE_NAME)} · Jogos Flash emulados com <a href="https://ruffle.rs" target="_blank" rel="noopener" style="text-decoration:underline">Ruffle</a> · Contato e remoção de conteúdo: <a href="mailto:${esc(CONTACT_EMAIL)}" style="text-decoration:underline">${esc(CONTACT_EMAIL)}</a>`;
document.getElementById('hq').addEventListener('keydown', e => { if (e.key === 'Enter') { F.q = e.target.value.trim(); F.limit = 48; location.hash = '#/'; route(); } });

function nav() {
  document.getElementById('nav').innerHTML = user
    ? `${isDev ? '<a class="btn" href="#/upload">+ Adicionar jogo</a><a class="btn g" style="color:#fff" href="#/admin">Painel</a><a class="btn g" style="color:#fff" href="#/users">Usuários</a>' : ''}<a class="btn g" style="color:#fff;display:flex;align-items:center;gap:6px" href="#/settings">${me?.avatar_url ? `<img src="${esc(me.avatar_url)}" style="width:20px;height:20px;border-radius:50%;object-fit:cover">` : '⚙'} ${esc(uname())}</a><button class="g btn" style="color:#fff" onclick="sb.auth.signOut()">Sair</button>`
    : `<a class="btn g" style="color:#fff" href="#/login">Entrar</a><a class="btn" href="#/register">Criar conta</a>`;
}

async function route() {
  const [, page, id] = location.hash.split('/');
  window.scrollTo(0, 0);
  stopSaves();
  try {
    if (page === 'game') return await gamePage(id);
    if (['upload', 'edit', 'admin', 'users'].includes(page)) {
      if (!user) return (location.hash = '#/login');
      if (!isDev) return (location.hash = '#/');
      return page === 'admin' ? await adminPage() : page === 'users' ? await usersPage() : await formPage(page === 'edit' ? id : null);
    }
    if (['login', 'register', 'forgot'].includes(page) && user) return (location.hash = '#/');
    if (page === 'login') return loginPage();
    if (page === 'register') return registerPage();
    if (page === 'forgot') return forgotPage();
    if (page === 'reset') return resetPage();
    if (page === 'settings') return user ? await settingsPage(id) : (location.hash = '#/login');
    if (page === 'u') return await profilePage(id);
    return await home();
  } catch (e) { app.innerHTML = `<div class="box msg">Erro: ${esc(friendly(e))}<br><small>Confira SB_URL / SB_KEY e se rodou os arquivos .sql.</small></div>`; }
}

const card = g => `<a class="card" href="#/game/${g.id}">${g.cover_url ? `<img loading="lazy" src="${esc(g.cover_url)}">` : '<div class="ph"></div>'}
<div class="ct">${esc(g.title)}</div><div class="cs">${esc(g.genre || '')}${g.series ? ' · ' + esc(g.series) : ''}</div>
<div class="cm">${g.rating_count ? `<span class="stars">★</span> ${Number(g.rating_avg).toFixed(1)} · ` : ''}${g.zip_url ? '▶ ' + (g.plays || 0).toLocaleString('pt-BR') : '🚧 Em breve'}</div></a>`;

async function home() {
  document.title = SITE_NAME;
  const filtered = F.q || F.cat || F.series;
  let q = sb.from('games').select('*', {count: 'exact'});
  if (F.cat) q = q.eq('genre', F.cat);
  if (F.series) q = q.eq('series', F.series);
  if (F.q) q = q.ilike('title', `%${F.q.replace(/[%,()]/g, ' ')}%`);
  q = q.order(F.sort, {ascending: false});
  if (F.sort === 'rating_avg') q = q.order('rating_count', {ascending: false});
  const [res, sr, feat] = await Promise.all([q.range(0, F.limit - 1), sb.from('games').select('series').not('series', 'is', null),
    filtered ? {data: []} : sb.from('games').select('*').eq('featured', true).limit(8)]);
  if (res.error) throw res.error;
  const series = [...new Set((sr.data || []).map(x => x.series))].sort();
  app.innerHTML = `${feat.data?.length ? `<h3 style="margin-top:0">⭐ Destaques</h3><div class="grid">${feat.data.map(card).join('')}</div>` : ''}
  <div class="chips">${['', ...CATS].map(c => `<button class="chip ${F.cat === c ? 'on' : ''}" onclick="setF('cat','${c}')">${c || 'Todos'}</button>`).join('')}</div>
  <div class="bar"><select onchange="setF('series',this.value)"><option value="">Todas as séries</option>${series.map(s => `<option ${F.series === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
  <select onchange="setF('sort',this.value)"><option value="created_at">Mais recentes</option><option value="plays" ${F.sort === 'plays' ? 'selected' : ''}>Mais jogados</option><option value="rating_avg" ${F.sort === 'rating_avg' ? 'selected' : ''}>Melhor avaliados</option></select>
  <span class="cs" style="align-self:center">${res.count ?? res.data.length} jogos</span>${F.q ? `<span class="tag">Busca: ${esc(F.q)} <a href="#/" onclick="F.q='';document.getElementById('hq').value='';setTimeout(home)">✕</a></span>` : ''}</div>
  <div class="grid">${res.data.map(card).join('') || '<p>Nenhum jogo encontrado.</p>'}</div>
  ${res.count > res.data.length ? `<p style="text-align:center"><button onclick="setF('limit',F.limit+48)">Ver mais jogos</button></p>` : ''}`;
}

async function gamePage(id) {
  const {data: g, error} = await sb.from('games').select('*').eq('id', id).single(); if (error) throw error;
  const [{data: rv}, rel] = await Promise.all([sb.from('reviews').select('*').eq('game_id', id).order('created_at', {ascending: false}),
    g.series ? sb.from('games').select('*').eq('series', g.series).neq('id', id).limit(6) : {data: []}]);
  const avg = Number(g.rating_avg) || 0, mineR = user && rv.find(r => r.user_id === user.id);
  document.title = g.title + ' – ' + SITE_NAME;
  app.innerHTML = `<h1 style="margin:0">${esc(g.title)}</h1><p class="cs">${esc(g.genre || '')}${g.series ? ' · ' + esc(g.series) : ''}</p>
  <div class="player" id="pl">${g.cover_url ? `<img src="${esc(g.cover_url)}">` : ''}
  ${g.zip_url ? `<div class="play"><button id="pb" style="font-size:20px;padding:14px 30px">▶ Jogar agora</button><small>${g.kind === 'html5' ? 'HTML5' : 'Flash (Ruffle)'}</small></div>`
    : `<div class="play" style="background:rgba(0,0,0,.5)"><b style="font-size:22px">🚧 Em breve</b></div>`}</div>
  <div class="cols"><div>
    <div class="box"><h3 style="margin-top:0">Sobre o jogo</h3><div class="desc">${esc(g.description) || '—'}</div></div>
    ${g.controls ? `<div class="box"><h3 style="margin-top:0">Como jogar</h3><div class="desc">${esc(g.controls)}</div></div>` : ''}
    ${g.screenshots?.length ? `<div class="box"><h3 style="margin-top:0">Capturas de tela</h3><div class="shots">${g.screenshots.map(s => `<img src="${esc(s)}" onclick="window.open(this.src)">`).join('')}</div></div>` : ''}
    <div class="box"><h3 style="margin-top:0">Avaliações (${rv.length}) <span class="stars">${avg ? stars(avg) + ' ' + avg.toFixed(1) : ''}</span></h3>
    ${user && me?.banned ? '<p class="msg">Sua conta foi banida e não pode avaliar jogos.</p>' : user ? `<select id="rs">${[5, 4, 3, 2, 1].map(n => `<option value="${n}" ${mineR?.rating === n ? 'selected' : ''}>${stars(n)}</option>`).join('')}</select>
    <textarea id="rc" placeholder="Seu comentário…" style="min-height:70px;margin:8px 0">${esc(mineR?.comment)}</textarea><button id="rb">${mineR ? 'Atualizar avaliação' : 'Enviar avaliação'}</button>` : '<p><a href="#/login" style="color:var(--ac)">Entre</a> para avaliar.</p>'}
    ${rv.map(r => `<div style="border-top:1px solid var(--bd);margin-top:12px;padding-top:8px"><a href="#/u/${encodeURIComponent(r.username || '')}"><b>${esc(r.username)}</b></a> <span class="stars">${stars(r.rating)}</span>${isDev ? ` <button class="g btn" style="padding:0 8px" onclick="delReview('${r.id}','${id}')">🗑</button>` : ''}<div class="desc">${esc(r.comment)}</div></div>`).join('')}</div>
    ${rel.data?.length ? `<div class="box"><h3 style="margin-top:0">Mais de ${esc(g.series)}</h3><div class="grid">${rel.data.map(card).join('')}</div></div>` : ''}
  </div><div><div class="box"><table>
    <tr><td>Categoria</td><td>${esc(g.genre)}</td></tr>${g.series ? `<tr><td>Série</td><td><a style="color:var(--ac)" href="#/" onclick="F.series=this.dataset.s;F.cat='';F.q='';" data-s="${esc(g.series)}">${esc(g.series)}</a></td></tr>` : ''}
    ${g.orig_dev ? `<tr><td>Criado por</td><td>${esc(g.orig_dev)}</td></tr>` : ''}${g.year ? `<tr><td>Ano</td><td>${g.year}</td></tr>` : ''}
    <tr><td>Jogadas</td><td id="pc" data-n="${g.plays || 0}">${(g.plays || 0).toLocaleString('pt-BR')}</td></tr>
    <tr><td>Nota</td><td>${avg ? `<span class="stars">★</span> ${avg.toFixed(1)} (${g.rating_count})` : '—'}</td></tr>
    <tr><td>Adicionado</td><td>${new Date(g.created_at).toLocaleDateString('pt-BR')}</td></tr></table>
    <div style="margin-top:10px">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    ${isDev ? `<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><a class="btn" href="#/edit/${g.id}">✎ Editar</a> <button class="g" style="color:var(--ac)" onclick="delGame('${g.id}')">Excluir</button>${g.zip_url ? `<p><a class="btn g" href="${esc(g.zip_url)}" download>⬇ Baixar arquivo (dev)</a></p>` : ''}` : ''}</div></div></div>`;
  if (window.pb) pb.onclick = () => play(g);
  if (g.zip_url) saveBox(g);
  if (window.rb) rb.onclick = async () => {
    const {error} = await sb.from('reviews').upsert({game_id: id, user_id: user.id, username: uname(), rating: +rs.value, comment: rc.value}, {onConflict: 'game_id,user_id'});
    error ? alert(friendly(error)) : gamePage(id);
  };
}
async function delReview(rid, gid) { if (confirm('Apagar esta avaliação?')) { await sb.from('reviews').delete().eq('id', rid); gamePage(gid); } }
async function delGame(id) {
  if (!confirm('Excluir este jogo e seus arquivos?')) return;
  const {data: g} = await sb.from('games').select('*').eq('id', id).single();
  const {error} = await sb.from('games').delete().eq('id', id); if (error) return alert(friendly(error));
  if (g) { await rmFile('covers', g.cover_url); await rmFile('games', g.zip_url); for (const s of g.screenshots || []) await rmFile('screens', s); }
  location.hash = '#/admin'; route();
}

// ---------- Progresso salvo no navegador (sem banco de dados) ----------
// Jogos Flash (Ruffle) e HTML5 gravam o progresso no localStorage. Aqui fazemos uma cópia por jogo no IndexedDB
// (restaurada automaticamente se o localStorage for apagado) e permitimos exportar/importar o progresso em arquivo.
const SAVE_SKIP = /^(sb-|pl:|supabase\.)/; // chaves do próprio site (login, contador) nunca entram no progresso
const lsAll = () => { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!SAVE_SKIP.test(k)) o[k] = localStorage.getItem(k); } } catch (e) {} return o; };
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('fc-saves', 1); r.onupgradeneeded = () => r.result.createObjectStore('saves'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = async id => { try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('saves').objectStore('saves').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } };
const idbSet = async (id, v) => { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('saves', 'readwrite'); t.objectStore('saves').put(v, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} };
let saver = null;
async function startSaves(g) {
  stopSaves();
  try { navigator.storage?.persist?.().catch(() => {}); } catch (e) {} // pede ao navegador para não apagar os dados do site
  const bak = (await idbGet(g.id)) || {keys: {}};
  try { for (const [k, v] of Object.entries(bak.keys)) if (localStorage.getItem(k) === null) localStorage.setItem(k, v); } catch (e) {} // restaura se o navegador perdeu
  const before = lsAll();
  const flush = async () => {
    const now = lsAll(), ch = {};
    for (const k in now) if (before[k] !== now[k]) ch[k] = now[k];
    if (!Object.keys(ch).length) return false;
    Object.assign(bak.keys, ch); Object.assign(before, ch); bak.ts = Date.now(); bak.title = g.title;
    await idbSet(g.id, bak);
    const s = document.getElementById('sv-s'); if (s) s.textContent = '💾 Progresso salvo às ' + new Date().toLocaleTimeString('pt-BR');
    return true;
  };
  const tick = setInterval(flush, 8000), onHide = () => { if (document.visibilityState === 'hidden') flush(); };
  document.addEventListener('visibilitychange', onHide); addEventListener('pagehide', flush);
  saver = {g, flush, stop() { clearInterval(tick); document.removeEventListener('visibilitychange', onHide); removeEventListener('pagehide', flush); }};
}
function stopSaves() { if (saver) { saver.flush(); saver.stop(); saver = null; } }
function saveBox(g) {
  const side = app.querySelector('.cols > div:last-child'); if (!side) return;
  side.insertAdjacentHTML('beforeend', `<div class="box"><h3 style="margin-top:0">💾 Progresso</h3><p class="cs" id="sv-i">Seu progresso é salvo automaticamente neste navegador. Se ele estiver configurado para apagar dados ao fechar, exporte o progresso para um arquivo.</p>
  <button class="g btn" id="sv-e">⬇ Exportar</button> <button class="g btn" id="sv-im">⬆ Importar</button><input type="file" id="sv-f" accept=".json" hidden></div>`);
  idbGet(g.id).then(b => { if (b?.ts) $('sv-i').textContent = 'Último backup: ' + new Date(b.ts).toLocaleString('pt-BR') + '. Salvo automaticamente neste navegador.'; });
  $('sv-e').onclick = async () => {
    if (saver?.g.id === g.id) await saver.flush();
    const b = await idbGet(g.id);
    if (!b || !Object.keys(b.keys || {}).length) return alert('Ainda não há progresso deste jogo. Jogue e salve dentro do jogo primeiro.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({app: 'flash-classics', game: g.id, title: g.title, ts: b.ts, keys: b.keys})], {type: 'application/json'}));
    a.download = 'progresso-' + g.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('sv-im').onclick = () => $('sv-f').click();
  $('sv-f').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()), ks = Object.entries(d.keys || {}).filter(([k, v]) => typeof v === 'string' && !SAVE_SKIP.test(k));
      if (d.app !== 'flash-classics' || !ks.length) throw new Error('Arquivo de progresso inválido.');
      if (!confirm(`Importar o progresso de “${d.title || 'jogo'}” e substituir o atual neste navegador?`)) return;
      stopSaves();
      for (const [k, v] of ks) localStorage.setItem(k, v);
      const b = (await idbGet(g.id)) || {keys: {}}; Object.assign(b.keys, Object.fromEntries(ks)); b.ts = Date.now(); b.title = g.title; await idbSet(g.id, b);
      alert('Progresso importado! Clique em “Jogar agora” para continuar de onde parou.'); gamePage(g.id);
    } catch (err) { alert(friendly(err)); }
  };
}

// ---------- Jogar ----------
function countPlay(g) { // conta 1 jogada por navegador a cada 30 min
  try { const k = 'pl:' + g.id, t = +localStorage.getItem(k) || 0; if (Date.now() - t < 1800000) return; localStorage.setItem(k, Date.now()); } catch (e) {}
  sb.rpc('inc_plays', {gid: g.id}).then(() => { const c = document.getElementById('pc'); if (c) c.textContent = (+c.dataset.n + 1).toLocaleString('pt-BR'); });
}
async function play(g) {
  const btn = document.getElementById('pb'); btn.disabled = true; btn.textContent = 'Carregando…';
  try {
    countPlay(g);
    await startSaves(g);
    if (g.kind === 'html5') return await playHtml5(g);
    if (!window.RufflePlayer) throw new Error('O emulador Ruffle não carregou. Verifique a conexão ou desative bloqueadores de anúncios.');
    document.getElementById('pl').innerHTML = `<div id="rf" style="width:100%;max-width:900px;aspect-ratio:${g.width}/${g.height};margin:0 auto"></div>
    <div style="padding:8px;background:#111"><button id="fs">⛶ Tela cheia</button><span id="sv-s" style="color:#aaa;margin-left:12px;font-size:13px"></span></div>`;
    const player = window.RufflePlayer.newest().createPlayer();
    player.style.cssText = 'width:100%;height:100%;display:block';
    document.getElementById('rf').appendChild(player);
    player.load({url: g.zip_url, autoplay: 'on', letterbox: 'on', backgroundColor: '#000000'});
    document.getElementById('fs').onclick = () => (player.enterFullscreen ? player.enterFullscreen() : player.requestFullscreen());
  } catch (e) { alert('Erro ao iniciar: ' + friendly(e)); btn.disabled = false; btn.textContent = '▶ Jogar agora'; }
}
async function swReady() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext || !window.caches) return false;
  try { await navigator.serviceWorker.register('sw.js'); await Promise.race([navigator.serviceWorker.ready, new Promise((_, r) => setTimeout(r, 4000))]); return true; } catch (e) { return false; }
}
async function playHtml5(g) {
  if (!(await swReady())) throw new Error('Jogos HTML5 precisam de HTTPS e do arquivo sw.js na mesma pasta do site.');
  const zip = await JSZip.loadAsync(await (await fetch(g.zip_url)).arrayBuffer());
  const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && !n.startsWith('__MACOSX'));
  const idx = names.filter(n => /(^|\/)index\.html$/i.test(n)).sort((a, b) => a.length - b.length)[0];
  if (!idx) throw new Error('index.html não encontrado no .zip');
  const base = idx.slice(0, idx.length - 10), sid = Math.random().toString(36).slice(2, 10), enc = r => r.split('/').map(encodeURIComponent).join('/');
  for (const k of await caches.keys()) if (k.startsWith('play-')) await caches.delete(k);
  const cache = await caches.open('play-' + sid);
  for (const n of names.filter(n => n.startsWith(base))) {
    const rel = n.slice(base.length), ext = rel.split('.').pop().toLowerCase();
    await cache.put(new URL(`__play/${sid}/` + enc(rel), location.href), new Response(await zip.files[n].async('arraybuffer'), {headers: {'Content-Type': MIME[ext] || 'application/octet-stream'}}));
  }
  document.getElementById('pl').innerHTML = `<iframe id="gf" style="width:${g.width}px;max-width:100%;height:${g.height}px;margin:0 auto" allow="fullscreen; autoplay; gamepad" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals"></iframe>
  <div style="padding:8px;background:#111"><button onclick="gf.requestFullscreen()">⛶ Tela cheia</button></div>`;
  document.getElementById('gf').src = new URL(`__play/${sid}/` + enc(idx.slice(base.length)), location.href).href;
}

const avatar = (p, s = 80) => p?.avatar_url ? `<img src="${esc(p.avatar_url)}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover">` : `<div style="width:${s}px;height:${s}px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${s * .4}px;font-weight:700">${esc((p?.username || '?')[0].toUpperCase())}</div>`;
const lnk = (h, t) => `<a href="${h}" style="color:var(--ac)">${t}</a>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { const i = $(b.dataset.t); i.type = i.type === 'password' ? 'text' : 'password'; } });
const onEnter = (ids, fn) => ids.forEach(i => $(i).addEventListener('keydown', e => e.key === 'Enter' && fn()));

function loginPage() {
  app.innerHTML = box('Entrar', `<label>E-mail</label><input id="l-e" type="email" autocomplete="email">${pwField('l-c', 'Senha')}
  <p style="text-align:right;margin:6px 0">${lnk('#/forgot', 'Esqueci minha senha')}</p><div class="msg" id="l-m"></div>
  <button id="l-b" style="width:100%">Entrar</button><p class="cs" style="text-align:center">Ainda não tem conta? ${lnk('#/register', 'Criar conta')}</p>`);
  const go = async () => {
    const email = $('l-e').value.trim(), pw = $('l-c').value;
    if (!email || !pw) return flash('l-m', 'Preencha e-mail e senha.');
    $('l-b').disabled = true;
    const {error} = await sb.auth.signInWithPassword({email, password: pw});
    $('l-b').disabled = false;
    if (!error) return (location.hash = '#/');
    if (/not confirmed/i.test(error.message)) {
      $('l-m').innerHTML = 'Confirme seu e-mail antes de entrar. <a href="#" id="l-r" style="text-decoration:underline">Reenviar e-mail</a>';
      $('l-r').onclick = async ev => { ev.preventDefault(); await sb.auth.resend({type: 'signup', email}); flash('l-m', 'E-mail de confirmação reenviado.', 1); };
    } else flash('l-m', authErr(error));
  };
  $('l-b').onclick = go; onEnter(['l-e', 'l-c'], go);
}

function registerPage() {
  app.innerHTML = box('Criar conta', `<label>Nome de usuário</label><input id="r-u" autocomplete="username" placeholder="meu_estudio"><small class="cs" id="r-um">3–20 caracteres: letras minúsculas, números e _</small>
  <label>E-mail</label><input id="r-e" type="email" autocomplete="email">${pwField('r-p', 'Senha', 1)}${pwField('r-r', 'Confirmar senha')}
  <label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input type="checkbox" id="r-t"> <span>Li e aceito os termos de uso e a política de privacidade.</span></label>
  <div class="msg" id="r-m"></div><button id="r-b" style="width:100%">Criar conta</button><p class="cs" style="text-align:center">Já tem conta? ${lnk('#/login', 'Entrar')}</p>`);
  meter('r-p');
  $('r-u').onblur = async () => { const n = $('r-u').value.trim().toLowerCase(); if (!n) return; const m = $('r-um');
    if (!USER_RE.test(n)) { m.style.color = 'var(--ac)'; m.textContent = 'Use 3–20 caracteres: letras minúsculas, números e _.'; }
    else if (await taken(n)) { m.style.color = 'var(--ac)'; m.textContent = 'Este nome de usuário já está em uso.'; }
    else { m.style.color = '#2a9d4a'; m.textContent = '✓ Disponível'; } };
  const go = async () => {
    try {
      const username = $('r-u').value.trim().toLowerCase(), email = $('r-e').value.trim(), pw = $('r-p').value;
      if (!USER_RE.test(username)) throw new Error('Nome de usuário inválido: 3–20 caracteres, letras minúsculas, números e _.');
      if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Informe um e-mail válido.');
      const pe = pwOk(pw, $('r-r').value); if (pe) throw new Error(pe);
      if (!$('r-t').checked) throw new Error('Aceite os termos para continuar.');
      $('r-b').disabled = true;
      if (await taken(username)) throw new Error('Este nome de usuário já está em uso.');
      const {data, error} = await sb.auth.signUp({email, password: pw, options: {data: {username}, emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (data.user && data.user.identities?.length === 0) throw new Error('Este e-mail já está cadastrado. Entre ou recupere a senha.');
      if (!data.session) app.innerHTML = box('Confira seu e-mail ✉️', `<p>Enviamos um link de confirmação para <b>${esc(email)}</b>. Clique nele para ativar sua conta e depois entre.</p><a class="btn" href="#/login">Ir para o login</a>`);
      else location.hash = '#/';
    } catch (e) { flash('r-m', authErr(e)); $('r-b').disabled = false; }
  };
  $('r-b').onclick = go; onEnter(['r-u', 'r-e', 'r-p', 'r-r'], go);
}

function forgotPage() {
  app.innerHTML = box('Recuperar senha', `<p class="cs">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p><label>E-mail</label><input id="f-e" type="email">
  <div class="msg" id="f-m"></div><button id="f-b" style="width:100%">Enviar link</button><p class="cs" style="text-align:center">${lnk('#/login', '← Voltar ao login')}</p>`);
  const go = async () => {
    const email = $('f-e').value.trim(); if (!email) return flash('f-m', 'Informe seu e-mail.');
    $('f-b').disabled = true;
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    $('f-b').disabled = false;
    error ? flash('f-m', authErr(error)) : flash('f-m', 'Se este e-mail estiver cadastrado, você receberá o link em instantes.', 1);
  };
  $('f-b').onclick = go; onEnter(['f-e'], go);
}

function resetPage() {
  if (!user) return (app.innerHTML = box('Link inválido ou expirado', `<p>Peça um novo link de recuperação.</p><a class="btn" href="#/forgot">Recuperar senha</a>`));
  app.innerHTML = box('Criar nova senha', `${pwField('n-p', 'Nova senha', 1)}${pwField('n-r', 'Confirmar nova senha')}<div class="msg" id="n-m"></div><button id="n-b" style="width:100%">Salvar nova senha</button>`);
  meter('n-p');
  const go = async () => {
    const pe = pwOk($('n-p').value, $('n-r').value); if (pe) return flash('n-m', pe);
    const {error} = await sb.auth.updateUser({password: $('n-p').value});
    error ? flash('n-m', authErr(error)) : (flash('n-m', 'Senha alterada! Redirecionando…', 1), setTimeout(() => location.hash = '#/', 1200));
  };
  $('n-b').onclick = go; onEnter(['n-p', 'n-r'], go);
}

async function profilePage(name) {
  const {data: p} = await sb.from('profiles').select('*').eq('username', decodeURIComponent(name || '')).maybeSingle();
  if (!p) return (app.innerHTML = '<div class="box">Usuário não encontrado.</div>');
  const {data: rv} = await sb.from('reviews').select('*, games(id,title,cover_url)').eq('user_id', p.id).order('created_at', {ascending: false}).limit(30);
  app.innerHTML = `<div class="box" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${avatar(p, 90)}<div><h2 style="margin:0">${esc(p.display_name || p.username)}</h2>
  <div class="cs">@${esc(p.username)} · membro desde ${new Date(p.created_at).toLocaleDateString('pt-BR')}</div><div class="desc" style="margin-top:6px">${esc(p.bio)}</div>
  ${safeUrl(p.website) ? `<a style="color:var(--ac)" target="_blank" rel="noopener noreferrer nofollow" href="${esc(p.website)}">🌐 ${esc(p.website)}</a>` : ''}</div></div>
  <h3>Avaliações recentes (${rv?.length || 0})</h3>${(rv || []).filter(r => r.games).map(r => `<div class="box" style="display:flex;gap:12px"><a href="#/game/${r.games.id}">${r.games.cover_url ? `<img src="${esc(r.games.cover_url)}" style="width:80px;height:64px;object-fit:cover;border-radius:6px">` : ''}</a>
  <div><a href="#/game/${r.games.id}"><b>${esc(r.games.title)}</b></a> <span class="stars">${stars(r.rating)}</span><div class="desc">${esc(r.comment)}</div></div></div>`).join('') || '<p class="cs">Nenhuma avaliação ainda.</p>'}`;
}

async function settingsPage(tab) {
  if (!['profile', 'security', 'account'].includes(tab)) tab = 'profile';
  const T = [['profile', 'Perfil'], ['security', 'Segurança'], ['account', 'Conta']];
  const wrap = body => app.innerHTML = `<h2 style="margin-top:0">Configurações da conta</h2><div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">${T.map(([k, l]) => `<a class="btn ${k === tab ? '' : 'g'}" href="#/settings/${k}">${l}</a>`).join('')}</div><div class="box f" style="max-width:560px">${body}</div>`;
  const hr = '<hr style="border:0;border-top:1px solid var(--bd);margin:22px 0">';
  if (tab === 'profile') {
    const p = me || {username: uname().toLowerCase().replace(/[^a-z0-9_]/g, '')};
    wrap(`<div style="display:flex;gap:14px;align-items:center">${avatar(p)}<div style="flex:1"><label style="margin-top:0">Foto de perfil (máx. 2 MB)</label><input id="s-a" type="file" accept="image/*"></div></div>
    <label>Nome de usuário</label><input id="s-u" value="${esc(p.username)}"><small class="cs">Letras minúsculas, números e _ (3–20). Sua página: #/u/${esc(p.username)}</small>
    <label>Nome de exibição</label><input id="s-n" value="${esc(p.display_name)}"><label>Bio</label><textarea id="s-b" style="min-height:90px">${esc(p.bio)}</textarea>
    <label>Site</label><input id="s-w" placeholder="https://" value="${esc(p.website)}"><div class="msg" id="s-m"></div><button id="s-s">Salvar perfil</button>`);
    $('s-s').onclick = async () => {
      try {
        $('s-s').disabled = true;
        const name = $('s-u').value.trim().toLowerCase(), site = $('s-w').value.trim();
        if (!USER_RE.test(name)) throw new Error('Usuário: 3–20 caracteres, letras minúsculas, números e _.');
        if (site && !safeUrl(site)) throw new Error('O site precisa começar com http:// ou https://');
        if (name !== p.username && await taken(name, user.id)) throw new Error('Este nome de usuário já está em uso.');
        let av = p.avatar_url; const f = $('s-a').files[0];
        if (f) { if (f.size > 2 * 1048576) throw new Error('A foto deve ter no máximo 2 MB.');
          const path = `${user.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, '_')}`;
          const {error: ue} = await sb.storage.from('avatars').upload(path, f, {contentType: f.type}); if (ue) throw ue;
          const old = av; av = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl; if (old) await rmFile('avatars', old); }
        const row = {id: user.id, username: name, display_name: $('s-n').value.trim(), bio: $('s-b').value, website: site, avatar_url: av};
        const {error} = await sb.from('profiles').upsert(row); if (error) throw error;
        if (name !== p.username) { await sb.from('reviews').update({username: name}).eq('user_id', user.id); }
        me = {...me, ...row}; nav(); flash('s-m', 'Perfil salvo!', 1);
      } catch (e) { flash('s-m', authErr(e)); }
      $('s-s').disabled = false;
    };
  } else if (tab === 'security') {
    wrap(`<h3 style="margin-top:0">E-mail</h3><p class="cs">Atual: <b>${esc(user.email)}</b></p><label>Novo e-mail</label><input id="e-n" type="email"><div class="msg" id="e-m"></div><button id="e-b">Alterar e-mail</button>${hr}
    <h3>Senha</h3>${pwField('p-c', 'Senha atual')}${pwField('p-n', 'Nova senha', 1)}${pwField('p-r', 'Confirmar nova senha')}<div class="msg" id="p-m"></div><button id="p-b">Alterar senha</button>`);
    meter('p-n');
    $('e-b').onclick = async () => {
      const email = $('e-n').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) return flash('e-m', 'Informe um e-mail válido.');
      const {error} = await sb.auth.updateUser({email}, {emailRedirectTo: location.origin + location.pathname});
      error ? flash('e-m', authErr(error)) : flash('e-m', 'Enviamos um link de confirmação. O e-mail só muda depois que você confirmar.', 1);
    };
    $('p-b').onclick = async () => {
      const pe = pwOk($('p-n').value, $('p-r').value); if (!$('p-c').value) return flash('p-m', 'Informe sua senha atual.'); if (pe) return flash('p-m', pe);
      $('p-b').disabled = true;
      const {error: ce} = await sb.auth.signInWithPassword({email: user.email, password: $('p-c').value});
      if (ce) { $('p-b').disabled = false; return flash('p-m', 'Senha atual incorreta.'); }
      const {error} = await sb.auth.updateUser({password: $('p-n').value}); $('p-b').disabled = false;
      error ? flash('p-m', authErr(error)) : (['p-c', 'p-n', 'p-r'].forEach(i => $(i).value = ''), flash('p-m', 'Senha alterada com sucesso!', 1));
    };
  } else {
    wrap(`<h3 style="margin-top:0">Sessões</h3><p class="cs">Encerra seu login em todos os navegadores e dispositivos.</p><button class="g btn" id="a-o">Sair de todos os dispositivos</button>${hr}
    <h3 style="color:var(--ac)">Excluir conta</h3><p class="cs">Apaga para sempre sua conta, sua foto e suas avaliações. Não dá para desfazer.</p>
    <label>Digite <b>${esc(uname())}</b> para confirmar</label><input id="a-c"><div class="msg" id="a-m"></div><button id="a-d" style="background:#c0392b">Excluir minha conta</button>`);
    $('a-o').onclick = async () => { await sb.auth.signOut({scope: 'global'}); location.hash = '#/login'; };
    $('a-d').onclick = async () => {
      try {
        if ($('a-c').value.trim() !== uname()) throw new Error('O nome digitado não confere.');
        if (!confirm('Última confirmação: excluir sua conta?')) return;
        $('a-d').disabled = true;
        await rmFile('avatars', me?.avatar_url);
        const {error} = await sb.rpc('delete_my_account'); if (error) throw error;
        await sb.auth.signOut({scope: 'local'}); location.hash = '#/';
      } catch (e) { flash('a-m', authErr(e)); $('a-d').disabled = false; }
    };
  }
}

sb.auth.onAuthStateChange((ev, s) => {
  const same = user?.id && user.id === s?.user?.id;
  user = s?.user || null;
  if (ev === 'PASSWORD_RECOVERY') { setTimeout(() => { location.hash = '#/reset'; route(); }, 0); return; }
  if (same && ev !== 'SIGNED_OUT') return; // renovação de token ao voltar para a aba: não re-renderiza
  if (!user && !['INITIAL_SESSION', 'SIGNED_OUT'].includes(ev)) return;
  setTimeout(async () => { // evita travar o supabase-js dentro do callback
    me = user ? (await sb.from('profiles').select('*').eq('id', user.id).maybeSingle()).data : null;
    const dv = user ? (await sb.from('devs').select('user_id,owner').eq('user_id', user.id).maybeSingle()).data : null;
    isDev = !!dv; isOwner = !!dv?.owner;
    nav(); route();
  }, 0);
});
window.addEventListener('hashchange', route);
</script>
</body>
</html>
